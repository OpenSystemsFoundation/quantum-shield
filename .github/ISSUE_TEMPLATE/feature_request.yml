name: Feature request
description: Suggest a new scan category, output, or improvement.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        QuantumShield is read-only, has no backend, and keeps org data on the user's machine. Proposals that change those principles are welcome, but please say so explicitly below.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: salesforce-api
    attributes:
      label: Salesforce API surface
      description: For new scan categories, which object or API exposes the data, and which permission is needed?
  - type: checkboxes
    id: principles
    attributes:
      label: Design principles
      options:
        - label: This keeps the scanner read-only, backend-free, and free of third-party requests.
