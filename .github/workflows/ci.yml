name: CI

# Cheap, fast checks only. Nothing here needs a Salesforce org, a browser, or
# any secrets: typecheck, unit tests (mocked / fixture-driven), and a static
# build. The Playwright e2e suite runs locally (`npm run test:e2e`).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Version consistency (package.json vs src/lib/version.ts)
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TS_VERSION="$(grep -oP "QSHIELD_VERSION = '\K[^']+" src/lib/version.ts)"
          echo "package.json: $PKG_VERSION / src/lib/version.ts: $TS_VERSION"
          if [ "$PKG_VERSION" != "$TS_VERSION" ]; then
            echo "::error::package.json version ($PKG_VERSION) does not match QSHIELD_VERSION ($TS_VERSION) in src/lib/version.ts"
            exit 1
          fi

      - name: Sync generated rule/regulation tables
        run: npm run sync:regulations

      - name: Generated tables are committed
        run: |
          if ! git diff --exit-code -- src/lib/rules/; then
            echo "::error::Generated rule/regulation tables are stale. Run 'npm run sync:regulations' and commit the result."
            exit 1
          fi

      - name: Typecheck (web + shared engine)
        run: npx tsc --noEmit -p tsconfig.json

      - name: Typecheck (CLI)
        run: npx tsc --noEmit -p tsconfig.cli.json

      - name: Unit tests
        run: npx vitest run

      - name: Build
        run: npm run build

      # Software bill of materials for the runtime dependencies, generated by
      # npm itself (no extra tooling). Kept for 14 days as a workflow artifact;
      # tagged releases attach and attest it (see release.yml).
      - name: SBOM (CycloneDX)
        run: npm sbom --sbom-format=cyclonedx --sbom-type=application --omit=dev > sbom.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json
          retention-days: 14
