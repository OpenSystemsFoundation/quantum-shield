# Weekly dependency updates. Minor and patch updates are grouped into one PR
# per ecosystem to keep the noise (and CI minutes) low; majors arrive alone.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: deps
    ignore:
      # Astro is held at 7.3.x: 7.4 needs Node >= 22.23.4 and the Cloudflare
      # build does not run it yet. Remove these once NODE_VERSION is raised.
      - dependency-name: astro
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "@astrojs/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
